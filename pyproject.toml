[project]
name = "relay"
version = "0.1.0"
description = "Machine vision bridge to connect YOLO to PLCs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
    "pylogix>=1.1.5",
    "ultralytics>=8.4.46"
]

[project.optional-dependencies]
ab = ["pylogix>=1.1.5"]
yolo = ["ultralytics>=8.4.46"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/relay"]

[tool.mypy]
python_version = "3.13"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pylogix>=1.1.5",
]
